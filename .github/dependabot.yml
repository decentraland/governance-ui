# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Goals:
#   - Security updates: fixes found in a run are grouped into one PR for minor/patch bumps and
#     one PR for major bumps, so a breaking major cannot hold back the safe fixes.
#   - Version updates: disabled (open-pull-requests-limit: 0) to avoid routine bump noise.
#     Security update PRs are not subject to that limit, so they keep flowing.
#
# Note: no `ignore` rules on purpose. `ignore` is marked as also affecting security
# updates, so a global semver-major ignore would silently suppress security fixes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 disables version updates for npm; security updates are not affected.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
